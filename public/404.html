<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Craft - CV Formatter</title>
    <script>
      // Single Page Application route recovery for Vercel, Netlify, and static hosts
      try {
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        if (path && path !== '/') {
          sessionStorage.setItem('spa_redirect', path + search + hash);
        }
      } catch (e) {
        // storage disabled
      }
      window.location.replace('/');
    </script>
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; background: #f8fafc; color: #475569;">
      <div style="text-align: center;">
        <div style="width: 32px; height: 32px; border: 3px solid #6366f1; border-top-color: transparent; border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite;"></div>
        <p style="font-size: 13px; font-weight: 500;">Loading Curriculum Craft...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
